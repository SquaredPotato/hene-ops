---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: heneops
  namespace: database
  annotations:
    kyverno.io/ignore: "true"
spec:
  instances: 2
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:18.3-1.1.1
  enableSuperuserAccess: true
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  storage:
    size: 20Gi
    storageClass: openebs-hostpath
  superuserSecret:
    name: cloudnative-pg-secret
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: 512MB
  monitoring:
    enablePodMonitor: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      enabled: true
      parameters:
        barmanObjectName: heneops
        serverName: &currentCluster heneops-v1
## Note: previousCluster needs to be set to the name of the previous
## cluster when recovering from an existing cnpg cluster
#  bootstrap:
#    recovery:
#      source: &previousCluster heneops-v0
## Note: Optionally, specify a timestamp to backup from.
## The operator selects the closest backup that was completed before that target.
#      recoveryTarget:
#       targetTime: "2025-10-21 23:00:00.00000+02"
## Note: externalClusters is needed when recovering from an existing cnpg cluster
#  externalClusters:
#    - name: *previousCluster
#      plugin:
#        name: barman-cloud.cloudnative-pg.io
#        parameters:
#          barmanObjectName: heneops
#          serverName: *previousCluster
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: heneops
spec:
  retentionPolicy: "30d"
  configuration:
    destinationPath: s3://postgres-cloudnative.heneops.backup/
    endpointURL: https://s3.eu-central-1.wasabisys.com
    s3Credentials:
      accessKeyId:
        name: cloudnative-pg-secret
        key: wasabi-id
      secretAccessKey:
        name: cloudnative-pg-secret
        key: wasabi-key
    data:
      compression: snappy
    wal:
      compression: snappy
      maxParallel: 12

