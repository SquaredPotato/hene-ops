cluster:
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
      # Reduce snapshot count to compact more frequently
      snapshot-count: "5000"           # Default is 100000
      # Limit the database size
      quota-backend-bytes: "1073741824" # 1 GB instead of default 2 GB
      # Auto-compact to prevent unbounded growth
      auto-compaction-mode: periodic
      auto-compaction-retention: "5m"
      # Increase heartbeat interval to reduce CPU overhead on slow networks
      # (defaults are 100ms / 1000ms; keep the 10:1 ratio between them)
      heartbeat-interval: "500"
      election-timeout: "5000"
    advertisedSubnets:
      - 192.168.0.0/21
---
apiVersion: v1alpha1
kind: KubeAdmissionControlConfig
name: PodSecurity
$patch: delete
---
# Allow scheduling on control-plane nodes
apiVersion: v1alpha1
kind: KubeNodeConfig
taints:
  node-role.kubernetes.io/control-plane:
    $patch: delete
---
apiVersion: v1alpha1
kind: KubeAPIServerConfig
certExtraSANs:
  - 127.0.0.1
  - 192.168.0.11
extraArgs:
  # https://kubernetes.io/docs/tasks/extend-kubernetes/configure-aggregation-layer/
  enable-aggregator-routing: "true"
---
apiVersion: v1alpha1
kind: KubeControllerManagerConfig
extraArgs:
  bind-address: 0.0.0.0
  # Reduce number of concurrent operations
  concurrent-deployment-syncs: "2"    # Default is 5
  concurrent-replicaset-syncs: "2"    # Default is 5
  kube-api-qps: "10"                  # Default is 20
  kube-api-burst: "20"                # Default is 30
---
apiVersion: v1alpha1
kind: KubeCoreDNSConfig
enabled: false
---
# Disable built-in CNI and kube-proxy to use Cilium
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
---
apiVersion: v1alpha1
kind: KubeSchedulerConfig
extraArgs:
  bind-address: 0.0.0.0
  # Reduce number of concurrent operations
  kube-api-qps: "10"                  # Default is 20
  kube-api-burst: "20"                # Default is 30
config:
  profiles:
    - schedulerName: default-scheduler
      pluginConfig:
        - name: PodTopologySpread
          args:
            defaultingType: List
            defaultConstraints:
              - maxSkew: 1
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: ScheduleAnyway
